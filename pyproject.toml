# Virtual workspace root — this repo is a monorepo of AI experiments, not a package
# itself. Shared tool config (ruff, pytest) lives here so every member inherits it.

[tool.uv.workspace]
members = ["coryphaeus"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["coryphaeus/src", "coryphaeus/tests", "coryphaeus/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["coryphaeus/tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "live: hits a real provider (Ollama or Featherless) — excluded from CI",
    "data: needs a fetched dataset (network on first run) — excluded from CI",
]
